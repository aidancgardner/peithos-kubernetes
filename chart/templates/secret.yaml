# PLACEHOLDER VALUES ONLY.
#
# Kubernetes Secrets are base64, which is encoding and not encryption. Anyone
# who can read the object can read the value. This exists to show the wiring:
# in a real cluster the values come from a secret manager (External Secrets
# Operator pulling from Azure Key Vault, or Sealed Secrets), and this template
# is what they land in.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "peithos.fullname" . }}-secrets
  labels:
    {{- include "peithos.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
