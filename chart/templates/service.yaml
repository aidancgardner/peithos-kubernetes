apiVersion: v1
kind: Service
metadata:
  name: {{ include "peithos.fullname" . }}
  labels:
    {{- include "peithos.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "peithos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
