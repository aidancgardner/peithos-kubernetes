{{- if .Values.web.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "peithos.fullname" . }}
  labels:
    {{- include "peithos.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "peithos.fullname" . }}
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percentage of the CPU *request*, not the limit. With a 100m request
          # and a 70% target, a pod averaging 70m of CPU triggers a scale up.
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Default is 5 minutes. Traffic here is spiky, and scaling down the
      # instant a spike ends just means scaling straight back up.
      stabilizationWindowSeconds: 300
{{- end }}
